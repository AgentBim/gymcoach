<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>chalkup</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C1118" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="chalkup" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128.png" />
    <meta name="description" content="Gymnastics workout planning for coaches" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        /* Values below match the chalkup redesign mockup 1:1 — variable
           NAMES are kept from the pre-redesign palette (--bg, --s1, --tx,
           etc.) since every page already styles itself through these; only
           what they resolve to changed, so the whole app re-themes from
           this one block instead of every inline style needing a rewrite.
           --mu2, --font-head and --font-sans were referenced throughout the
           app but never defined here (dead custom properties) — now given
           real values as part of this pass. */
        --bg: #15191A;
        --s1: #1E2426;
        --s2: #262D30;
        --br: #313A3D;
        --br2: #38424A;
        --tx: #ECEEE9;
        --mu: #66716D;
        --mu2: #9AA6A2;
        --ac: #C7E45C;
        --ac2: #A9C947;
        --ac-ink: #171C0E;
        --blue: #6BA9DE;
        --amber: #E7A23E;
        --coral: #E2695A;
        --teal: #4FB88A;
        --violet: #A184E3;
        --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-head: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        --r: 8px;
        --rl: 12px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      html { overflow-x: hidden; }
      input, button, select, textarea { font-family: var(--font); box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      button { cursor: pointer; }
      img, svg { max-width: 100%; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--s1); }
      ::-webkit-scrollbar-thumb { background: var(--br2); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
