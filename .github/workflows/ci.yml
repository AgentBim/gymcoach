name: CI

on:
  pull_request:
  push:
    branches: [main, codex/audit-fixes]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start isolated Supabase database
        run: >-
          supabase start --exclude
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from all migrations
        run: supabase db reset --local
      - name: Compare rebuilt schema with production fingerprint
        shell: bash
        run: |
          supabase db query --local --file supabase/tests/schema_fingerprint.sql --output csv > /tmp/local-schema-components.csv
          if ! diff --strip-trailing-cr --unified \
              supabase/tests/production_schema_components.csv \
              /tmp/local-schema-components.csv; then
            echo "Detailed local column and function-grant metadata:"
            supabase db query --local --file supabase/tests/schema_diagnostics.sql --output json
            exit 1
          fi
      - name: Run database privilege contract
        run: supabase db query --local --file supabase/tests/security_regression.sql
      - name: Run RLS and assignment authorization tests
        run: supabase test db --local supabase/tests/authorization.test.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
