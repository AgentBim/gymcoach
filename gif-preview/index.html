<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChalkUp · Exercise Library Mockup</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"><style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        /* Values below match the chalkup redesign mockup 1:1 — variable
           NAMES are kept from the pre-redesign palette (--bg, --s1, --tx,
           etc.) since every page already styles itself through these; only
           what they resolve to changed, so the whole app re-themes from
           this one block instead of every inline style needing a rewrite.
           --mu2, --font-head and --font-sans were referenced throughout the
           app but never defined here (dead custom properties) — now given
           real values as part of this pass. */
        --bg: #15191A;
        --s1: #1E2426;
        --s2: #262D30;
        --br: #313A3D;
        --br2: #38424A;
        --tx: #ECEEE9;
        --mu: #66716D;
        --mu2: #9AA6A2;
        --ac: #C7E45C;
        --ac2: #A9C947;
        --ac-ink: #171C0E;
        --blue: #6BA9DE;
        --amber: #E7A23E;
        --coral: #E2695A;
        --teal: #4FB88A;
        --violet: #A184E3;
        --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-head: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
        --r: 8px;
        --rl: 12px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      html { overflow-x: hidden; }
      input, button, select, textarea { font-family: var(--font); box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      button { cursor: pointer; }
      img, svg { max-width: 100%; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--s1); }
      ::-webkit-scrollbar-thumb { background: var(--br2); border-radius: 3px; }
    

    @keyframes aiSlideUp { from { transform:translateY(100%) } to { transform:translateY(0) } }
    @keyframes aiSpin { to { transform:rotate(360deg) } }
    .ai-spin { animation:aiSpin 1s linear infinite; display:inline-block }

ne-height: 1.6; margin-bottom: 8px;\">Maintain L-sit position (legs parallel to floor) throughout entire pull-up movement. Extreme core demand.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 5 reps · Rest 90s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.15); color: rgb(231, 162, 62);\">Medium<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Negative Pull-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Jump to top position, lower yourself as slowly as possible (5-10 seconds). Build pull strength eccentrically.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 6 reps · Rest 60s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Neutral-Grip Pull-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Parallel grip (palms facing each other), pull chin to bar level. Easier on shoulders than pronated grip.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 45s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">One-Arm Push-up Progression<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Full wide-leg one-arm push-up, lower chest to floor with control. Keep hips square.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 5 reps · Rest 90s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div>< ba(231, 162, 62, 0.15); color: rgb(231, 162, 62);\">Medium<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Reverse Grip Push-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hands turned outward 180 degrees (fingers pointing toward feet). Unusual bicep and forearm load.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 45s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Ring Bicep Curl<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Stand facing anchor point, lean back with rings at hip level, curl rings to forehead. Adjust angle.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 12 reps · Rest 30s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border- play: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Straddle Planche Lean<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Legs straddled wide, lean forward on hands shifting center of mass over wrists. Advanced planche prep.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10s · Rest 90s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Superman Push-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Explosive push-up launching hands and feet off ground simultaneously. Land softly.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 6 reps · Rest 60s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.15); color: rgb(231, 162, 62);\">Medium<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Towel Pull-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Drape towels over bar, grip one in each hand, perform pull-up. Challenges grip and forearm strength.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 60s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Tricep Dips<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">On parallel bars or chair, lower body by bending elbows. Press back to straight.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 12 reps · Rest 30s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Tricep Push-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hands directly under shoulders, elbows track straight back as you lower. Press back up keeping elbows tight to body.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 30s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Tuck Front Lever Row<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">In tuck front lever position on bar, perform rowing motion pulling chest to bar.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 5 reps · Rest 90s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.15); color: rgb(226, 105, 90);\">Hard<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Typewriter Pull-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Pull up, then slide body to one side keeping chin above bar, across and down the other side.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 5 reps · Rest 90s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.15); color: rgb(231, 162, 62);\">Medium<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Wide-Grip Pull-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hands wider than shoulder-width, pull chest toward bar. Emphasizes lat width over bicep.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">4 sets × 6 reps · Rest 60s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Wrist Push-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Push-up on back of wrists (fists facing down). Builds wrist flexor strength and conditioning.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 30s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.15); color: rgb(79, 184, 138);\">Easy<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Wrist Roller<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hold roller at shoulder height, wind and unwind weight using only wrists.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 30s<\/div><\/div>", "<div style=\"background: var(--s2); border: 1px solid var(--br); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; s: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Finger Tendon Glide<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Move fingers through: straight, hook fist, full fist, straight knuckle fist. Tendon gliding exercises for finger health.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Fist Push-up Wrist Warm-up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Push-ups on fists to keep wrist neutral. Wrist conditioning without full extension load.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Grip Squeeze (towel)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Squeeze a rolled towel as hard as possible for 5 seconds, relax. Grip strengthening and forearm endurance.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.14); color: rgb(231, 162, 62);\">Arms<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hammer Curl (light prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Neutral grip curl with very light load. Elbow tendon conditioning. Brachioradialis activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; mar -size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Child's Pose<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Kneel, sit back on heels, reach arms overhead on floor. Hold. Thoracic spine and lat stretch with gentle traction.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Face Pull (prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Rope at face height, pull to face with elbows high. Posterior shoulder chain activation protecting the thoracic spine.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hip Hinge Pattern<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hinge at hips with flat back, dowel touching head/back/tailbone. Teaches proper loading mechanics protecting lumbar spine.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Lumbar ISOMETRIC Hold<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Prone on elbows (sphinx position), gently press pubic bone down, feel lower back muscles engage. Lumbar stabilizer activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20s · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">McGill Curl-Up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">One knee bent, hands under lumbar, partial sit-up maintaining neutral spine. Spine-sparing core stability drill.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Pallof Press Anti-Rotation<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Band anchored at chest height, press straight ahead and return. Trains spine to resist rotation under load.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 12 reps · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Prone Press-Up<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie face down, place hands under shoulders, press upper body up while hips stay down. McKenzie extension for disc health.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; ont-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Side-Lying Thoracic Rotation<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on side knees bent, top arm sweeps overhead to opposite side. Thoracic rotation with rib cage opening.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Supine Spinal Twist<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on back, bring one knee across body while keeping shoulders flat. Lumbar rotation and paraspinal muscle release.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Thoracic Extension over Foam Roller<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Sit with roller behind mid-back, support head, extend over roller one segment at a time. Thoracic mobility.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.14); color: rgb(107, 169, 222);\">Back<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Thread the Needle<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">On all fours, thread one arm under body reaching to opposite side. Thoracic rotation mobility essential for gymnastics.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Ankle Alphabet<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Draw the alphabet with your foot making shapes as large as possible. Full ankle range of motion activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">2 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Ankle CARs<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Controlled articular rotations of the ankle in full available range under tension. Essential before any jumping or tumbling.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">2 sets × 10 reps · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Ankle Dorsiflexion Mobilisation<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Half-kneeling at wall, push knee over toes as far as possible. Ankle dorsiflexion mobility crucial for landing mechanics.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Calf Raise Eccentric<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Rise on both feet, lower on one foot over 5 seconds. Soleus and Achilles tendon loading. Injury prevention for jumpers.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Clamshell<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Side-lying, knees bent, rotate top knee up like a clamshell. Glute medius and external hip rotator activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Couch Stretch<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Rear foot elevated on wall in lunge, drive hips forward. Hip flexor and quad stretch. Corrects anterior pelvic tilt.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Glute Bridge ISOMETRIC Hold<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Bridge up and hold with maximal glute squeeze. Gluteal activation and hip extension pattern reinforcement.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hip 90/90 Stretch<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Sit with both hips at 90°, rotate between positions. Hip internal and external rotation mobility for healthy knee alignment.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hip FABER Stretch<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on back, cross ankle over opposite knee, gently press knee down or pull shin toward chest. Piriformis and hip external rotator.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Lateral Band Walk (prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Mini-band at ankles, quarter-squat, step side to side. Gluteus medius activation for knee valgus prevention.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Nordic Curl Negative (assisted)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Use a band for assistance, lower body toward floor over 5 seconds. Hamstring tendon conditioning essential for gymnastics.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 6 reps · Rest 60s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Pigeon Stretch<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Front shin across body, extend rear leg, hold. Deep hip external rotator and glute stretch. Protects the hip joint.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 45s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Single-Leg Balance Eyes Closed<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Stand on one leg, close eyes, hold stable. Proprioception training for ankle and knee joint position sense.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Step-Down (slow eccentric)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Stand on step, lower opposite foot to tap floor over 5 seconds. Single-leg eccentric quad control for knee health.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(226, 105, 90, 0.14); color: rgb(226, 105, 90);\">Legs<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Terminal Knee Extension (prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Band behind knee, slight bend, extend against band. VMO activation drill for knee stability and patellar tracking.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Abdominal Bracing<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Stand or lie, draw in navel then brace abs as if about to be punched. Hold 5 seconds. Teaches transverse abdominis activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Copenhagen Short Lever<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Side plank with lower knee on bench (not foot), easier lever. Adductor and lateral core loading for groin protection.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20s · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Dead Bug (prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on back, arms and knees at 90°, lower opposite arm and leg with 5-second count. Maintain lower back flat throughout. Deep core stability.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Diaphragmatic Breathing<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on back, one hand on chest one on belly. Breathe so only belly hand rises. Diaphragm and deep core reset.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 60s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hip Flexor Activation<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Lie on back, press one hand against raised knee for 5 seconds, other leg straight. Psoas and hip flexor activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20s · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Hollow Body Progression<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Progress from knees tucked to legs extended as strength allows. Build hollow body position incrementally without compensation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20s · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">McGill Big 3 — Bird Dog<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">From all fours, extend opposite arm/leg, hold 10 seconds, sweep under body. The complete McGill bird dog protocol.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: lor: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Segmental Roll-Down<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Stand tall, tuck chin, roll down one vertebra at a time reaching hands toward floor. Spinal mobility and segmental control.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 15s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(79, 184, 138, 0.14); color: rgb(79, 184, 138);\">Core<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(107, 169, 222, 0.12); color: rgb(107, 169, 222);\">stability<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Stir the Pot (light)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: /div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Supine Leg Lowering<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Both legs vertical, lower one slowly to just above floor. Back flat. Tests and builds lumbo-pelvic control.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 8 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.14); color: rgb(161, 132, 227);\">Shoulders<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Band External Rotation (90°)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Elbow at 90° at shoulder height, rotate forearm back against band resistance. Slow and controlled. Key rotator cuff activator before overhead work.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.14); color: rgb(161, 132, 227);\">Shoulders<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Band Internal Rotation<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Elbow at 90° at side, rotate forearm inward against band. Balance to external rotation work. Essential for shoulder health.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 15 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.14); color: rgb(161, 132, 227);\">Shoulders<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(199, 228, 92, 0.12); color: rgb(199, 228, 92);\">activation<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Band Pull-Apart (prehab)<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Hold band at chest width with straight arms, pull apart to full extension. Rear delt and external rotator activation.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 20 reps · Rest 20s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.14); color: rgb(161, 132, 227);\">Shoulders<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.12); color: rgb(161, 132, 227);\">mobility<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Cross-Body Shoulder Stretch<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">Pull one arm across chest with opposite hand, hold at point of tension. Posterior shoulder and rotator cuff mobility.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 30s · Rest 10s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 140, 0.04); border: 1px solid rgba(50, 200, 140, 0.18); border-radius: 12px; padding: 12px;\"><div style=\"display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7px; flex-wrap: wrap; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(161, 132, 227, 0.14); color: rgb(161, 132, 227);\">Shoulders<\/span><div style=\"display: flex; gap: 4px;\"><span style=\"padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(231, 162, 62, 0.12); color: rgb(231, 162, 62);\">strength<\/span><\/div><\/div><div style=\"font-size: 13px; font-weight: 600; margin-bottom: 4px;\">Cuban Press<\/div><div style=\"font-size: 12px; color: var(--mu); line-height: 1.6; margin-bottom: 8px;\">From hang position, externally rotate to press overhead. Full shoulder health movement combining ER and press in one pattern.<\/div><div style=\"font-size: 11px; color: var(--mu); font-family: var(--mono);\">3 sets × 10 reps · Rest 30s<\/div><\/div>", "<div style=\"background: rgba(50, 200, 1 /* Browser-local behavior for the captured ChalkUp library mockup. */
const host = document.getElementById('mockup');
let category = new URLSearchParams(location.search).get('category')==='prehab'?'prehab':'strength', group = ['Arms','Back','Legs','Core','Shoulders'].includes(new URLSearchParams(location.search).get('group'))?new URLSearchParams(location.search).get('group'):'All', difficulty = 'All', query = '';
let additions = [];
try { additions = JSON.parse(localStorage.getItem('chalkup-mock-exercises') || '[]'); } catch {}
const parse = html => { const t = document.createElement('template'); t.innerHTML = html; return t.content; };
const cardList = root => root.querySelector('main > div:nth-child(2) > div');
const originals = CARDS;
function toast(message) {
  document.getElementById('notice')?.remove();
  const e = document.createElement('div'); e.id = 'notice'; e.setAttribute('role','status'); e.textContent = message;
  e.style.cssText = 'position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--br2);border-radius:10px;padding:12px 18px;z-index:100;max-width:90%;width:max-content;font-size:12px;box-shadow:0 8px 32px #0005';
  document.body.append(e); setTimeout(()=>e.remove(),3500);
}
function navigation() {
  host.querySelectorAll('a').forEach(a=>{
    const name = a.textContent.trim(); a.href = '#';
    a.onclick = e => { e.preventDefault(); if(name==='Library') showLibrary(); else toast(name+' is outside this exercise library mockup.'); };
  });
  const nav = host.querySelector('nav');
  if(nav) nav.querySelectorAll('button').forEach(b=>b.onclick=()=>toast('This navigation is a visual placeholder in the mockup.'));
}
function selected(buttons, value, segment=false) {
  buttons.forEach(b=>{
    const active=b.textContent.trim()===value;
    b.style.background=active?(segment?'var(--s2)':'var(--ac)'):(segment?'transparent':'var(--br)');
    b.style.color=active?(segment?'var(--tx)':'var(--ac-ink)'):'var(--mu)';
    b.style.fontWeight=active?'600':'400'; b.setAttribute('aria-pressed',String(active));
  });
}
function updateList() {
  const list=cardList(host); if(!list) return;
  host.querySelector('#legs-gif-link')?.remove();
  host.querySelector('#prehab-gif-link')?.remove();
  if(category==='prehab'&&Object.keys(PREHAB_MEDIA).length){
    const link=document.createElement('a');link.id='prehab-gif-link';link.href='prehab-gifs/';
    link.textContent=Object.keys(PREHAB_MEDIA).length+' of 80 Prehab GIFs available · View gallery →';
    link.style.cssText='display:block;background:var(--s1);border:1px solid var(--br);border-radius:8px;padding:10px 12px;margin-bottom:12px;color:var(--ac);font-size:12px;font-weight:600';
    list.before(link);
  }
  const strengthAvailable=Object.values(GIF_MEDIA).filter(m=>group==='All'||m.group===group||(group==='Legs'&&!m.group)).length;
  if(category==='strength'&&strengthAvailable){
    const link=document.createElement('a');link.id='legs-gif-link';link.href=(group==='All'?'strength':group.toLowerCase())+'-gifs/';
    link.textContent=strengthAvailable+' of '+(group==='All'?200:40)+' '+(group==='All'?'Strength':group)+' GIFs available · '+(group==='All'?'View galleries →':'View gallery →');
    link.style.cssText='display:block;background:var(--s1);border:1px solid var(--br);border-radius:8px;padding:10px 12px;margin-bottom:12px;color:var(--ac);font-size:12px;font-weight:600';
    list.before(link);
  }
  list.style.cssText='display:grid;grid-template-columns:1fr;gap:8px';
  list.innerHTML=originals[category].join('');
  additions.filter(x=>x.category===category).forEach(x=>{
    const card=parse(originals.strength[0]).firstElementChild;
    card.children[0].children[0].textContent=x.group;
    card.children[0].children[1].firstElementChild.textContent=x.difficulty;
    card.children[1].textContent='★ '+x.name; card.children[2].textContent=x.description;
    card.children[3].textContent=`${x.sets} sets × ${x.amount}${x.timed?'s':' reps'} · Rest ${x.rest}s`;
    list.append(card);
  });
  let count=0;
  [...list.children].forEach(card=>{
    const g=card.children[0].children[0].textContent;
    const d=card.children[0].children[1].textContent;
    const matches=(group==='All'||g===group)&&(difficulty==='All'||d===difficulty)&&card.textContent.toLowerCase().includes(query.toLowerCase());
    card.hidden=!matches; if(matches) count++;
    const name=card.children[1].textContent.trim();
    const media=category==='strength' ? GIF_MEDIA[name] : category==='prehab'?PREHAB_MEDIA[name]:null;
    if(media){
      const section=document.createElement('details');
      section.style.cssText='margin-top:12px;border-top:1px solid var(--br);padding-top:10px';
      const summary=document.createElement('summary'); summary.textContent='View exercise GIF';
      summary.style.cssText='cursor:pointer;color:var(--ac);font-size:12px;font-weight:600';
      const img=document.createElement('img');img.alt=name+' exercise demonstration';img.loading='lazy';
      img.style.cssText='display:block;width:100%;max-height:360px;object-fit:contain;background:#fbf7ec;border-radius:8px;margin-top:10px';
      const pause=document.createElement('button');pause.textContent='Pause GIF';
      pause.style.cssText='border:1px solid var(--br2);border-radius:7px;padding:6px 10px;color:var(--mu2);background:var(--s2);font-size:11px;margin-top:8px';
      let paused=false;
      pause.onclick=()=>{paused=!paused;img.src=paused?media.poster:media.gif;pause.textContent=paused?'Play GIF':'Pause GIF';};
      section.append(summary,img,pause);section.ontoggle=()=>{if(section.open&&!img.hasAttribute('src'))img.src=media.gif;};
      if(media.form_note){
        const note=document.createElement('p');
        note.textContent='Technique note: '+media.form_note.split(';')[0]+'.';
        note.style.cssText='font-size:12px;line-height:1.6;color:var(--mu2);margin-top:8px';
        if(media.reference_url){
          const reference=document.createElement('a');reference.href=media.reference_url;
          reference.textContent=' Technique reference';reference.target='_blank';reference.rel='noopener';
          note.append(reference);
        }
        section.append(note);
      }
      card.append(section);
    }
  });
  host.querySelector('main > div:first-child > div:first-child > span:nth-child(2)').textContent=count;
  if(!count) list.innerHTML='<div style="text-align:center;color:var(--mu);padding:40px 0;font-size:13px">No exercises found</div>';
}
function showLibrary() {
  host.innerHTML=SNAPSHOTS[category]; navigation();
  const controls=host.querySelector('main > div:first-child > div:nth-child(2)');
  const search=controls.querySelector('input'); search.value=query; search.setAttribute('aria-label','Search exercises');
  search.oninput=()=>{ query=search.value; updateList(); };
  const rows=[...controls.children].filter(c=>c.tagName==='DIV');
  const tabs=[...rows[0].querySelectorAll('button')];
  tabs.forEach((b,i)=>b.onclick=()=>{category=['strength','prehab','mobility'][i]; difficulty='All'; showLibrary();});
  selected(tabs, {strength:'💪 Strength',prehab:'🛡 Prehab',mobility:'🧘 Mobility'}[category], true);
  const groups=[...rows[1].querySelectorAll('button')]; selected(groups,group);
  groups.forEach(b=>b.onclick=()=>{group=b.textContent.trim();selected(groups,group);updateList();});
  if(rows[2]) { const levels=[...rows[2].querySelectorAll('button')];selected(levels,difficulty);
    levels.forEach(b=>b.onclick=()=>{difficulty=b.textContent.trim();selected(levels,difficulty);updateList();}); }
  host.querySelector('main > div:first-child button').onclick=showCustom;
  updateList(); window.scrollTo(0,0);
}
function showCustom() {
  host.innerHTML=SNAPSHOTS.custom; navigation(); window.scrollTo(0,0);
  const main=host.querySelector('main') || host.querySelector('#root > div > div:first-child');
  let muscle='Arms', level='Easy', timed=false;
  const inputs=[...main.querySelectorAll('input')], desc=main.querySelector('textarea');
  inputs[0].setAttribute('aria-label','Exercise name'); inputs[0].required=true;
  if(desc) desc.setAttribute('aria-label','Description');
  const numbers=inputs.filter(x=>x.type==='number');
  numbers.forEach((x,i)=>x.setAttribute('aria-label',['Sets','Reps or seconds','Rest seconds'][i]));
  const buttons=[...main.querySelectorAll('button')];
  const groups=buttons.filter(b=>['Arms','Back','Legs','Core','Shoulders'].includes(b.textContent.trim()));
  const levels=buttons.filter(b=>['Easy','Medium','Hard'].includes(b.textContent.trim()));
  const measures=buttons.filter(b=>['Reps','Time (s)'].includes(b.textContent.trim()));
  groups.forEach(b=>b.onclick=()=>{muscle=b.textContent.trim(); selected(groups,muscle);});
  levels.forEach(b=>b.onclick=()=>{level=b.textContent.trim();selected(levels,level);});
  measures.forEach(b=>b.onclick=()=>{timed=b.textContent.trim()==='Time (s)';selected(measures,b.textContent.trim());});
  buttons.forEach(b=>{
    if(['←','Cancel'].includes(b.textContent.trim())) b.onclick=showLibrary;
    if(b.textContent.trim()==='Add to library') { b.disabled=false; b.onclick=()=>{
      const name=inputs[0].value.trim(); if(!name){inputs[0].reportValidity();inputs[0].focus();return;}
      if(numbers.some(x=>!x.value || Number(x.value)<1)){toast('Enter a positive value for sets, reps or time, and rest.');return;}
      additions.push({category,group:muscle,difficulty:level,timed,name,description:desc?.value.trim()||'',sets:numbers[0]?.value||3,amount:numbers[1]?.value||10,rest:numbers[2]?.value||30});
      localStorage.setItem('chalkup-mock-exercises',JSON.stringify(additions)); group='All';difficulty='All';query=name;showLibrary();toast('Saved to this local mockup.');
    };}
  });
}
showLibrary();
</script></body></html>
