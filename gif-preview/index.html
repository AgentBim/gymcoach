<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15191A"><title>ChalkUp · Exercises design preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
:root{--bg:#15191A;--s1:#1E2426;--s2:#262D30;--br:#313A3D;--br2:#38424A;--tx:#ECEEE9;--mu:#66716D;--mu2:#9AA6A2;--ac:#C7E45C;--ac-ink:#171C0E;--font:'IBM Plex Sans',sans-serif}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--font)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:3px}h1{font-size:28px;line-height:1.15;letter-spacing:-.5px}h2{font-size:20px;line-height:1.3}small{display:block}#mockup{display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--s1);border-right:1px solid var(--br);height:100vh;position:sticky;top:0;padding:20px 14px;display:flex;flex-direction:column}.brand{font:800 26px 'Big Shoulders Display',sans-serif;color:var(--ac);padding:0 12px 18px}.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1}.nav-item{background:none;color:var(--mu2);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-align:left}.nav-item>span{font-size:20px;width:22px;text-align:center}.nav-item.active{background:#c7e45c1f;color:var(--ac);font-weight:600}.coach{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--br);font-weight:600;font-size:13px}.coach small{color:var(--mu2);font-size:11px;font-weight:400}.avatar{width:32px;height:32px;display:grid;place-items:center;background:#c7e45c1f;color:var(--ac);border-radius:50%}main{flex:1;min-width:0}.plan-tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--br)}.plan-tabs button{padding:14px 14px 12px;background:none;color:var(--mu2);border-bottom:2px solid transparent;font-size:13.5px}.plan-tabs .active{color:var(--ac);border-color:var(--ac);font-weight:700}
.page{max-width:1440px;margin:auto;padding:28px 28px 40px}.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow,.label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu2);font-weight:600}.eyebrow{margin-bottom:6px}.header-actions{display:flex;gap:10px;align-items:center}.search{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid var(--br2);border-radius:9px;padding:0 12px;min-height:40px;width:220px;color:var(--mu2)}.search span{font-size:23px}.search input{width:100%;min-width:0;background:none;border:none;outline:none;font-size:13px}.primary,.secondary{padding:10px 14px;border-radius:9px;min-height:40px;font-size:13px;font-weight:600}.primary{background:var(--ac);color:var(--ac-ink)}.secondary{background:var(--s2);border:1px solid var(--br2)}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.pills{display:flex;gap:4px;flex-wrap:wrap}.pills+.pills{border-left:1px solid var(--br);padding-left:12px}.pill{background:transparent;border:1px solid transparent;border-radius:20px;padding:6px 11px;color:var(--mu2);font-size:12px;white-space:nowrap}.pill.on{background:#c7e45c1a;border-color:#c7e45c40;color:var(--ac);font-weight:600}.pill span{font-size:10px;opacity:.75;margin-left:3px}
.library-layout{display:flex;gap:18px;align-items:flex-start}.card{background:var(--s1);border:1px solid var(--br);border-radius:12px}.exercise-list{flex:1;min-width:0;overflow:hidden}.table-head,.exercise-row{display:grid;grid-template-columns:minmax(150px,2fr) 104px 72px 76px 84px 16px;gap:12px;align-items:center}.table-head{padding:10px 16px;color:var(--mu2);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.exercise-row{width:100%;padding:12px 16px;border-top:1px solid var(--br);text-align:left;background:none;color:var(--tx)}.exercise-row:hover{background:#ffffff04}.exercise-row.selected{background:#c7e45c12}.name-cell{min-width:0}.name-cell strong{font-size:14.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name-cell small{font-size:12px;color:var(--mu2);margin-top:2px}.type,.dose,.used{font-size:12px;color:var(--mu2)}.arrow{color:var(--mu2);font-size:20px}.group-chip,.chip,.yours{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}.arms{background:#e7a23e24;color:#E7A23E}.back{background:#6ba9de24;color:#6BA9DE}.legs{background:#e2695a24;color:#E2695A}.core{background:#4fb88a24;color:#4FB88A}.shoulders{background:#a184e324;color:#A184E3}.chip{background:var(--s2);color:var(--mu2);font-weight:400}.yours{background:#c7e45c20;color:var(--ac);margin-top:4px}
.detail-panel{width:340px;flex-shrink:0;padding:18px;position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}.detail-title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.icon-button{width:36px;height:36px;flex-shrink:0;background:none;color:var(--mu2);font-size:24px;border-radius:8px}.media{background:#fbf7ec;border-radius:9px;overflow:hidden}.media img{display:block;width:100%;aspect-ratio:576/540;object-fit:contain}.play{width:100%;min-height:42px;background:var(--s2);color:var(--ac);font-size:12px;font-weight:600}.technique{font-size:12px;color:var(--mu2);line-height:1.6}.cue{font-size:14px;line-height:1.55;margin-top:6px}.stats{display:flex;gap:8px}.stats>div{flex:1;border:1px solid var(--br);border-radius:10px;padding:10px 12px}.stats strong{display:block;font-size:18px;margin-top:4px}.muted{color:var(--mu2);font-size:13px;line-height:1.6;margin-top:6px}.add-workout{align-self:flex-start}.no-media{padding:24px 12px;background:var(--s2);border-radius:9px;text-align:center;color:var(--mu2);font-size:12px}.empty{padding:40px 20px;text-align:center;color:var(--mu2)}.empty small{margin-top:6px;font-size:12px}.preview-note{margin-top:24px;font-size:11px;color:var(--mu2)}.bottom-nav{display:none}
dialog{margin:auto;max-width:calc(100vw - 24px);width:460px;max-height:90dvh;overflow:auto;padding:22px;background:var(--s1);color:var(--tx);border:1px solid var(--br2);border-radius:16px}dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}#detail-dialog[open]{display:flex;flex-direction:column;gap:16px}dialog label{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-size:12px;color:var(--mu2)}dialog input,dialog select,dialog textarea{background:var(--bg);border:1px solid var(--br2);padding:11px 12px;border-radius:9px;min-height:44px;color:var(--tx);font-size:15px;width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.workout-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px 0;border-top:1px solid var(--br);margin-top:12px}.workout-row small{font-size:11px;color:var(--mu2)}#notice{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;padding:12px 18px;background:var(--s2);border:1px solid var(--br2);border-radius:10px;z-index:10;font-size:12px;box-shadow:0 8px 32px #0005}
.mobile-type{display:none}.media-stage{aspect-ratio:576/540;position:relative;display:grid;place-items:center;color:#343c38}.media-stage .demonstration{width:100%;height:100%;object-fit:contain}.media-stage video{position:absolute;inset:0;background:#fbf7ec}.media-status{background:var(--s2);color:var(--mu2);font-size:12px;padding:0 12px 10px;line-height:1.5}.media-status:empty{display:none}.play:disabled{cursor:wait;opacity:.8}

@media(max-width:1000px){.sidebar,.detail-panel,.table-head{display:none}.page{padding:22px 16px 100px}.page-header{align-items:stretch;flex-direction:column;gap:16px;margin-bottom:18px}h1{font-size:26px}.header-actions{width:100%}.search{width:auto;flex:1}.header-actions .primary{white-space:nowrap}.pills+.pills{border-left:0;padding-left:0}.filters{gap:8px}.exercise-row{grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:13px 14px}.type,.used,.arrow{display:none}.name-cell strong{font-size:13.5px}.dose{font-size:12px}.group-chip{font-size:10.5px;padding:2px 7px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1e2426f5;border-top:1px solid var(--br);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);z-index:2}.bottom-nav .nav-item{flex:1;flex-direction:column;gap:1px;text-align:center;font-size:10px;padding:6px 4px}.bottom-nav .nav-item.active{background:none}.bottom-nav .nav-item>span{font-size:22px}.preview-note{line-height:1.8}dialog{padding:18px}.plan-tabs{padding-left:8px}}

const host=document.getElementById('mockup'), groups=['All','Arms','Back','Legs','Core','Shoulders'], cats=['all','strength','prehab','mobility'];
const params=new URLSearchParams(location.search);
let category=cats.includes(params.get('category'))?params.get('category'):'all', group=groups.includes(params.get('group'))?params.get('group'):'All', query='',selectedId=null,lastTrigger=null,timer;
let additions=[],workout=[];
try{additions=JSON.parse(localStorage.getItem('chalkup-mock-exercises')||'[]');}catch{}
if(!Array.isArray(additions))additions=[];
additions=additions.filter(e=>e&&typeof e.name==='string').map((e,i)=>({...e,id:e.id||'custom-'+i,group:e.group||'Arms',category:cats.includes(e.category)&&e.category!=='all'?e.category:'strength',difficulty:e.difficulty||'Medium',prescription:e.prescription||`${e.sets||3} sets × ${e.amount||10}${e.timed?'s':' reps'} · Rest ${e.rest||60}s`,is_custom:true}));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=v=>v.charAt(0).toUpperCase()+v.slice(1), all=()=>[...EXERCISES,...additions];

const chip=e=>`<span class="group-chip ${esc(e.group.toLowerCase())}">${esc(e.group)}</span>`;

const nav=()=>['Today','Athletes','Inbox','Plan'].map((n,i)=>`<button class="nav-item ${n==='Plan'?'active':''}" data-nav="${n}" ${n==='Plan'?'aria-current="page"':''}><span aria-hidden="true">${['◷','♧','▱','▤'][i]}</span>${n}</button>`).join('');
host.innerHTML=`<aside class="sidebar"><div class="brand">chalkup</div><nav aria-label="Main">${nav()}</nav><div class="coach"><span class="avatar">C</span><div>Coach preview<small>Local design mockup</small></div></div></aside><main><nav class="plan-tabs" aria-label="Plan sections"><button data-tab="Programs">Programs</button><button data-tab="Workouts">Workouts <span id="workout-count"></span></button><button class="active" aria-current="page" data-tab="Exercises">Exercises</button></nav><section class="page"><header class="page-header"><div><p class="eyebrow" id="summary"></p><h1>Exercises</h1></div><div class="header-actions"><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="Search exercises" aria-label="Search exercises"></label><button class="primary" id="new-exercise">＋ New exercise</button></div></header><div class="filters"><div class="pills" id="categories" role="group" aria-label="Category"></div><div class="pills" id="groups" role="group" aria-label="Muscle group"></div></div><div class="library-layout"><section class="card exercise-list" aria-label="Exercise library"><div class="table-head"><span>Exercise</span><span>Muscle group</span><span>Type</span><span>Default</span><span>Used in</span><span></span></div><div id="rows"></div></section><aside class="detail-panel card" id="detail-panel" aria-label="Exercise details"></aside></div><footer class="preview-note">Design preview · 280 captured exercises · additions and workout selections stay in this browser.</footer></section></main><nav class="bottom-nav" aria-label="Mobile main">${nav()}</nav>`;
function rememberFocus(){
 const e=document.activeElement;
 for(const key of ['exercise','category','group'])if(e?.dataset[key])return `[data-${key}="${CSS.escape(e.dataset[key])}"]`;
 return null;
}
function restoreFocus(selector){if(selector)document.querySelector(selector)?.focus({preventScroll:true});}
function matches(e){return (category==='all'||e.category===category)&&(group==='All'||e.group===group)&&e.name.toLowerCase().includes(query.trim().toLowerCase());}
function filters(){
 const focus=rememberFocus();
 document.getElementById('summary').textContent=`${all().length} exercises · ${additions.length} yours`;
 document.getElementById('categories').innerHTML=cats.map(c=>`<button class="pill ${category===c?'on':''}" aria-pressed="${category===c}" data-category="${c}">${cap(c)} <span>${all().filter(e=>c==='all'||e.category===c).length}</span></button>`).join('');
 document.getElementById('groups').innerHTML=groups.map(g=>`<button class="pill ${group===g?'on':''}" aria-pressed="${group===g}" data-group="${g}">${g}</button>`).join('');

}
function renderRows(){
 const focus=rememberFocus(), shown=all().filter(matches);
 document.getElementById('rows').innerHTML=shown.length?shown.map(e=>`<button class="exercise-row ${selectedId===e.id?'selected':''}" data-exercise="${esc(e.id)}" aria-pressed="${selectedId===e.id}"><span class="name-cell"><strong>${esc(e.name)}</strong>${e.is_custom?'<span class="yours">Yours</span>':''}<small>${esc(e.difficulty)}${category==='all'?`<span class="mobile-type"> · ${cap(e.category)}</span>`:''}</small></span><span class="muscle">${chip(e)}</span><span class="type">${cap(e.category)}</span><span class="dose">${esc(dose(e)[1])} × ${esc(dose(e)[2].replace(' reps',''))}</span><span class="used">${workout.includes(e.id)?'1 draft':'Not used'}</span><span class="arrow" aria-hidden="true">›</span></button>`).join(''):`<div class="empty">${category==='mobility'?'No mobility exercises yet.':'No exercises match.'}<small>${category==='mobility'?'This section is ready for your future library.':'Try another search or filter.'}</small></div>`;
 restoreFocus(focus);
}
function stopMedia(){document.querySelectorAll('.media video').forEach(v=>v.pause());}
function disposeMedia(){stopMedia();document.querySelectorAll('.media video').forEach(v=>{v.removeAttribute('src');v.load();});mediaObserver.disconnect();}
const mediaObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)entry.target.querySelector('video')?.pause();}),{threshold:0.1});
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
reducedMotion.addEventListener('change',()=>{document.querySelectorAll('.media video').forEach(v=>{v.loop=!reducedMotion.matches;if(reducedMotion.matches)v.pause();});});
function mediaError(box,message){
 const v=box.querySelector('video');if(v){v.pause();v.hidden=true;}
 box.querySelector('img').hidden=box.dataset.posterFailed==='true';
 box.dataset.failed='true';box.querySelector('.media-status').textContent=message;
 const b=box.querySelector('[data-play]');b.textContent='↻ Retry demonstration';b.disabled=false;
}
function bindMedia(){document.querySelectorAll('.media img').forEach(img=>{
 const failed=()=>{const box=img.closest('.media');box.dataset.posterFailed='true';img.hidden=true;box.querySelector('.media-status').textContent='Preview image unavailable. You can still play the demonstration.';};
 img.addEventListener('error',failed);if(img.complete&&!img.naturalWidth)failed();
});}
async function playMedia(button){
 const e=all().find(e=>e.id===button.dataset.play),box=button.closest('.media');
 let video=box.querySelector('video');
 if(video&&!video.paused){video.pause();return;}
 stopMedia();
 if(box.dataset.failed==='true'){
  if(video){mediaObserver.unobserve(video);video.removeAttribute('src');video.load();video.remove();video=null;}
  delete box.dataset.failed;
 }
 if(!video){
  video=document.createElement('video');video.className='demonstration';video.hidden=true;video.controls=true;video.muted=true;video.playsInline=true;video.loop=!reducedMotion.matches;video.preload='none';video.poster=e.media.poster;video.setAttribute('aria-label',e.name+' exercise demonstration');
  video.addEventListener('error',()=>mediaError(box,'Demonstration could not load. Your coaching cue is still available. Try again.'));
  video.addEventListener('waiting',()=>{if(box.isConnected)box.querySelector('.media-status').textContent='Loading demonstration…';});
  video.addEventListener('playing',()=>{if(!box.isConnected)return;video.hidden=false;box.querySelector('img').hidden=true;box.querySelector('.media-status').textContent='';button.textContent='Ⅱ Pause demonstration';button.disabled=false;});
  const paused=()=>{if(!box.isConnected||box.dataset.failed==='true')return;button.textContent='▶ Play demonstration';button.disabled=false;};
  video.addEventListener('pause',paused);video.addEventListener('ended',paused);
  video.src=e.media.video;box.querySelector('.media-stage').append(video);mediaObserver.observe(box.querySelector('.media-stage'));
 }
 button.textContent='Loading…';button.disabled=true;box.querySelector('.media-status').textContent='Loading demonstration…';
 try{await video.play();}catch(error){if(!box.isConnected||error.name==='AbortError'){if(box.isConnected){button.disabled=false;button.textContent='▶ Play demonstration';box.querySelector('.media-status').textContent='';}return;}mediaError(box,'Demonstration could not play. Try again.');}
}
function updateWorkoutStatus(){
 document.querySelectorAll('[data-workout-status]').forEach(el=>el.textContent=workout.includes(el.dataset.workoutStatus)?'Preview workout draft':'Not in any workout yet.');

 document.getElementById('workout-count').textContent=workout.length?`(${workout.length})`:'';
}
function detail(e){const d=dose(e);return `<div class="detail-title"><div><h2>${esc(e.name)}</h2><div class="tags">${chip(e)}<span class="chip">${cap(e.category)}</span><span class="chip">${esc(e.difficulty)}</span></div></div><button class="icon-button" data-close-detail aria-label="Close details">×</button></div>${e.media?`<div class="media"><div class="media-stage"><img class="demonstration" src="${esc(e.media.poster)}" alt="${esc(e.name)} exercise demonstration preview"></div><button class="play" data-play="${esc(e.id)}">▶ Play demonstration</button><p class="media-status" role="status" aria-live="polite"></p></div>${e.demonstration_note?`<p class="technique">${esc(e.demonstration_note)}</p>`:''}`:'<div class="no-media">Demonstration not added yet</div>'}<div><p class="label">Coaching cue</p><p class="cue">${esc(e.description||'No cue yet.')}</p></div><div class="stats"><div><p class="label">Sets</p><strong>${esc(d[1])}</strong></div><div><p class="label">${/^[0-9]+s$/.test(d[2])?'Secs':'Reps'}</p><strong>${esc(d[2].replace(/ reps$|s$/g,''))}</strong></div><div><p class="label">Rest</p><strong>${esc(d[3])}s</strong></div></div><div><p class="label">Used in</p><p class="muted" data-workout-status="${esc(e.id)}">${workout.includes(e.id)?'Preview workout draft':'Not in any workout yet.'}</p></div><button class="primary add-workout" data-add="${esc(e.id)}">${workout.includes(e.id)?'Added to workout':'Add to a workout'}</button>`;}
function renderDetail(){
 const e=all().find(e=>e.id===selectedId),p=document.getElementById('detail-panel'),d=document.getElementById('detail-dialog');disposeMedia();p.innerHTML='';d.innerHTML='';
 if(!e){if(d.open)d.close();p.innerHTML='<h2>Pick an exercise</h2><p class="muted">See its cue, defaults, demonstration and the workouts that use it.</p>';return;}
 if(matchMedia('(max-width:1000px)').matches){d.innerHTML=detail(e);if(!d.open)d.showModal();}else{if(d.open)d.close();p.innerHTML=detail(e);}
 bindMedia();
}
function closeDetail(){stopMedia();const d=document.getElementById('detail-dialog');if(d.open)d.close();selectedId=null;renderRows();renderDetail();document.querySelector('[data-exercise="'+CSS.escape(lastTrigger?.dataset.exercise||'')+'"]')?.focus();}
function syncFilter(){const focus=rememberFocus();const u=new URL(location.href);u.searchParams.set('category',category);u.searchParams.set('group',group);history.replaceState(null,'',u);selectedId=null;renderDetail();filters();renderRows();restoreFocus(focus);}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.category){category=b.dataset.category;syncFilter();}
 if(b.dataset.group){group=b.dataset.group;syncFilter();}
 if(b.dataset.exercise){selectedId=b.dataset.exercise;renderRows();lastTrigger=document.querySelector(`[data-exercise="${CSS.escape(selectedId)}"]`);renderDetail();}
 if(b.hasAttribute('data-close-detail'))closeDetail();
 if(b.dataset.play)void playMedia(b);
 if(b.dataset.add){if(!workout.includes(b.dataset.add))workout.push(b.dataset.add);renderRows();updateWorkoutStatus();toast('Added to the local preview workout.');}
 if(b.dataset.tab==='Workouts')showWorkout();else if(b.dataset.tab==='Programs')toast('Programs is outside this exercise-library design preview.');
 if(b.dataset.nav&&b.dataset.nav!=='Plan')toast(`${b.dataset.nav} is outside this exercise-library design preview.`);
 if(b.id==='new-exercise')showCreate();
 if(b.dataset.dismiss)document.getElementById(b.dataset.dismiss).close();
 if(b.dataset.remove){workout=workout.filter(id=>id!==b.dataset.remove);showWorkout();renderRows();updateWorkoutStatus();document.querySelector('#workout-dialog [data-remove]')?.focus();}
});
document.getElementById('search').oninput=e=>{query=e.target.value;if(selectedId&&!all().some(x=>x.id===selectedId&&matches(x))){selectedId=null;renderDetail();}renderRows();};
document.getElementById('detail-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(d.id==='detail-dialog')closeDetail();else d.close();}}}));
function showCreate(){const d=document.getElementById('create-dialog');d.innerHTML=`<form><div class="detail-title"><h2 id="create-title">New exercise</h2><button type="button" class="icon-button" data-dismiss="create-dialog" aria-label="Close new exercise">×</button></div><p class="muted">It joins your local library and is available in the preview workout.</p><label>Name<input name="name" required maxlength="120" placeholder="e.g. Ring row" autofocus></label><label>Muscle group<select name="group">${groups.slice(1).map(g=>`<option>${g}</option>`).join('')}</select></label><label>Type<select name="category">${cats.slice(1).map(c=>`<option value="${c}" ${c===category?'selected':''}>${cap(c)}</option>`).join('')}</select></label><label>Coaching cue<textarea name="description" rows="3" maxlength="1500" placeholder="Add an optional cue"></textarea></label><div class="dialog-actions"><button type="button" class="secondary" data-dismiss="create-dialog">Cancel</button><button class="primary">Add exercise</button></div></form>`;
 d.querySelector('form').onsubmit=event=>{event.preventDefault();const f=new FormData(event.target),name=f.get('name').trim();if(!name){toast('Enter an exercise name.');return;}const c=f.get('category'),e={id:'custom-'+crypto.randomUUID(),name,group:f.get('group'),category:c,description:f.get('description').trim(),difficulty:'Medium',prescription:c==='prehab'?'2 sets × 10 reps · Rest 20s':'3 sets × 10 reps · Rest 60s',is_custom:true};additions.push(e);try{localStorage.setItem('chalkup-mock-exercises',JSON.stringify(additions));}catch{toast('Added for this session; browser storage is unavailable.');}d.close();category='all';group='All';query='';document.getElementById('search').value='';filters();selectedId=e.id;renderRows();renderDetail();};d.showModal();
}
function showWorkout(){stopMedia();const d=document.getElementById('workout-dialog');d.innerHTML=`<div class="detail-title"><h2 id="workout-title">Preview workout</h2><button class="icon-button" data-dismiss="workout-dialog" aria-label="Close workout">×</button></div><p class="muted">A local selection to review the exercise-to-workout interaction.</p>${workout.length?workout.map(id=>{const e=all().find(e=>e.id===id);return `<div class="workout-row"><div><strong>${esc(e.name)}</strong><small>${esc(e.prescription)}</small></div><button class="secondary" data-remove="${esc(id)}" aria-label="Remove ${esc(e.name)}">Remove</button></div>`;}).join(''):'<p class="empty">Pick an exercise, then add it to a workout.</p>'}`;if(!d.open)d.showModal();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMedia();});
matchMedia('(max-width:1000px)').addEventListener('change',()=>{if(selectedId)renderDetail();});
filters();renderRows();renderDetail();
</script></body></html>
